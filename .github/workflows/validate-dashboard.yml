name: Validate Dashboard Assets

on:
  push:
    branches: [main, master]
    paths:
      - "*.html"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-dashboard.yml"
  pull_request:
    paths:
      - "*.html"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate committed generated artifact boundary
        run: python scripts/check_dashboard_artifact_boundary.py
